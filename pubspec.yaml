name: chatbot_copilot
description: "Workshop sample: a Flutter chat app connected to a Microsoft Copilot Studio agent through Direct Line."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2              # Calls the Direct Line REST API
  flutter_dotenv: ^5.2.1    # Reads settings from the .env file
  url_launcher: ^6.3.1      # Opens citation links in a browser
  flutter_spinkit: ^5.2.1   # Typing animation (see DemoConfig.useSpinKitWave)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
